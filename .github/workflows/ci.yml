name: CI

on:
  push:
    branches: [main]
  pull_request:

# Variables attendues par turbo.json (globalEnv) — valeurs de test uniquement.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aetheris_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  BETTER_AUTH_URL: http://localhost:3001
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  NEXT_PUBLIC_WS_URL: http://localhost:3002
  WEB_ORIGIN: http://localhost:3001

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pnpm check` inclut apps/server/test/app.e2e-spec.ts, qui instancie
    # AppModule : PrismaService.$connect() exige une base joignable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aetheris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contrôle des migrations destructives
        run: node scripts/check-migrations.mjs --base "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aetheris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Base vierge : db push (pas d'historique de migrations sur Neon).
      - run: pnpm db:push
      - run: pnpm exec playwright install --with-deps chromium
      # Serveurs dev lancés ici plutôt que via webServer : playwright.config.ts
      # part du principe qu'ils tournent déjà (cf. commentaire dans la config).
      - name: Run E2E
        run: |
          pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          ready() {
            curl -sf --max-time 5 http://localhost:3001 >/dev/null &&
              curl -sf --max-time 5 http://localhost:3002/api >/dev/null
          }

          for _ in $(seq 1 90); do
            if ready; then break; fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/dev.log"
              exit 1
            fi
            sleep 2
          done
          if ! ready; then
            cat "$RUNNER_TEMP/dev.log"
            exit 1
          fi

          pnpm test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            ${{ runner.temp }}/dev.log
          if-no-files-found: ignore
          retention-days: 7
