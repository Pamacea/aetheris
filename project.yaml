# Shadow Secret Project Configuration
# This file was auto-generated by: shadow-secret init-project
#
# Modify the 'targets' section below to define where secrets should be injected.
#
vault:
  # Échappement des antislashs Windows (ou utilise V:/-recovery/keys.txt)
  source: ".enc.env"
  engine: "sops"
  age_key_path: "V:\\-recovery\\keys.txt"
  require_mount: false

targets:
  - name: "env-file"
    path: ".env"
    placeholders:
      - "$DATABASE_URL"
      - "$DATABASE_URL_UNPOOLED"
      - "$PGHOST"
      - "$PGHOST_UNPOOLED"
      - "$PGUSER"
      - "$PGDATABASE"
      - "$PGPASSWORD"
      - "$POSTGRES_URL"
      - "$POSTGRES_URL_NON_POOLING"
      - "$POSTGRES_USER"
      - "$POSTGRES_HOST"
      - "$POSTGRES_PASSWORD"
      - "$POSTGRES_DATABASE"
      - "$POSTGRES_URL_NO_SSL"
      - "$POSTGRES_PRISMA_URL"
      - "$BETTER_AUTH_SECRET"
      - "$BETTER_AUTH_URL"
      - "$DISCORD_CLIENT_ID"
      - "$DISCORD_CLIENT_SECRET"
      - "$GITHUB_CLIENT_ID"
      - "$GITHUB_CLIENT_SECRET"

# ================================
# IMPORTANT: Configuration Required
# ================================
#
# Before running 'shadow-secret unlock':
#   1. Edit the 'targets' section above to match your project structure
#   2. Add your secrets to .enc.env:
#      sops --decrypt .enc.env > .env.tmp
#      # Edit .env.tmp with your secrets
#      sops --encrypt .env.tmp > .enc.env
#      rm .env.tmp
#   3. Run: shadow-secret unlock
#
# Example targets:
#   For a .env file:
#     - name: "env-file"
#       path: ".env"
#       placeholders:
#         - "$ALL"  # Inject all secrets
#
#   For a JSON config:
#     - name: "config-json"
#       path: "config.json"
#       placeholders:
#         - "$API_KEY"
#         - "$DATABASE_URL"
